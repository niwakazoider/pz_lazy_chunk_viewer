<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PZ B42 Lazy Chunk Viewer <span class="small">v0.6</span></title>
<style>
:root{
  color-scheme:dark;
  --bg:#0e1115;
  --panel:#181d24;
  --border:#323a45;
  --text:#edf2f7;
  --muted:#95a1af;
  --accent:#78c7ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) 340px;width:100%;height:100%}
#mapWrap{position:relative;min-width:0;overflow:hidden;background:#090c0f}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
#hud{position:absolute;left:12px;top:12px;pointer-events:none;background:rgba(10,13,17,.82);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 9px;font-size:12px;color:#d7e2ed;white-space:pre}
aside{background:var(--panel);border-left:1px solid var(--border);padding:14px;overflow:auto}
h1{font-size:16px;margin:0 0 6px}
.small{font-size:12px;color:var(--muted)}
.group{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.label{font-size:12px;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{border:1px solid #3a4450;background:#242b34;color:var(--text);border-radius:7px;padding:7px 9px;cursor:pointer}
button.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
select{width:100%;border:1px solid #3a4450;background:#242b34;color:var(--text);border-radius:7px;padding:7px 9px}
select:disabled{opacity:.55}
.saveRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
input[type=range]{width:100%}
code{color:#b7dcff;overflow-wrap:anywhere}
#info{font-size:12px;line-height:1.45}
#info ul{padding-left:18px;margin:5px 0 10px}
.stat{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px;margin:3px 0}
#status{font-size:12px;color:var(--muted);min-height:2.6em}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  aside{position:absolute;right:8px;top:8px;width:min(330px,calc(100% - 16px));max-height:48%;border:1px solid var(--border);border-radius:10px;background:rgba(24,29,36,.94)}
}
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <canvas id="map"></canvas>
    <div id="hud"></div>
  </div>
  <aside>
    <h1>PZ B42 Lazy Chunk Viewer <span class="small">v0.10</span></h1>
    <div class="small">8×8 chunkを現在位置の周囲だけ遅延レンダリングしてキャッシュします。</div>

    <div class="group">
      <div class="label">Save data <span id="saveVersion" class="small"></span></div>
      <div class="saveRow">
        <select id="saveSelect" aria-label="Save data"></select>
        <button type="button" id="saveRefreshBtn">再検索</button>
      </div>
      <div id="saveMeta" class="small" style="margin-top:6px">セーブデータを検索中…</div>
    </div>

    <div class="group">
      <div class="label">Floor</div>
      <div class="row" id="floors">
        <button type="button" data-z="-1">B1</button>
        <button type="button" data-z="0">1F</button>
        <button type="button" data-z="1">2F</button>
        <button type="button" data-z="2">3F</button>
      </div>
    </div>

    <div class="group">
      <div class="label">Layer</div>
      <div class="row" id="modes">
        <button type="button" data-mode="static">Static</button>
        <button type="button" data-mode="save">Save main</button>
        <button type="button" data-mode="overlay">Overlay</button>
      </div>
      <div style="margin-top:9px">
        <div class="label">Save opacity <span id="opacityText">70%</span></div>
        <input id="opacity" type="range" min="0" max="100" value="70">
      </div>
      <div class="small" style="margin-top:6px">extra spriteは現在描画しません。</div>
    </div>

    <div class="group">
      <div class="label">View</div>
      <div class="row">
        <button type="button" id="homeBtn">プレイヤーへ戻る</button>
        <button type="button" id="gridBtn" class="active">Chunk境界</button>
      </div>
      <div style="margin-top:9px">
        <div class="label">Zoom <span id="zoomText">100%</span></div>
        <input id="zoom" type="range" min="35" max="220" value="100">
      </div>
    </div>

    <div class="group">
      <div class="stat"><span>中心chunk</span><code id="centerChunk">-</code></div>
      <div class="stat"><span>Player</span><code id="playerPos">-</code></div>
      <div class="stat"><span>現在 / memory</span><span id="loadedCount">0</span></div>
      <div class="stat"><span>Queue</span><span id="queueCount">0</span></div>
      <div id="status"></div>
    </div>

    <div class="group">
      <div class="label">Selected square</div>
      <div id="info" class="small">マップをクリックすると、そのworld squareを調べます。</div>
    </div>
  </aside>
</div>

<script src="/viewer.js"></script>
</body>
</html>
